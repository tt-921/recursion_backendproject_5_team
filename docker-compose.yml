services:
  db:
    container_name: db
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
  app:
    build:
      context: ./server
    container_name: app
    depends_on:
      - db
    volumes:
      - ./server/laravel:/var/www/html
      - /var/www/html/vendor
    ports:
      - "8000:8000" 
  react:
    container_name: react
    build:
      context: ./client
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # ファイル変更の監視をポーリング方式に変更。CPU負荷が高くなるため、本番環境では使用しない。
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host"]
volumes:
  db_data: